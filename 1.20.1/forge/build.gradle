plugins {
    id 'multiloader-loader'
    id 'net.neoforged.moddev.legacyforge'
}

legacyForge {
    version = "${minecraft_version}-${forge_version}"
    accessTransformers.from(project(':common').file('src/main/resources/META-INF/accesstransformer.cfg').absolutePath)

    parchment {
        minecraftVersion = parchment_minecraft
        mappingsVersion = parchment_version
    }
    runs {
        configureEach {
            ideName = "Forge ${it.name.capitalize()} (${project.path})" // Unify the run config names with fabric
            systemProperty 'forge.enabledGameTestNamespaces', mod_id
        }
        client {
            client()
            gameDirectory = project.file('runs/client')
            // ./gradlew :forge:runClient -Pshowcase builds a showcase world, screenshots it into runs/client/screenshots and quits
            if (project.hasProperty('showcase')) systemProperty 'sugarplumplushies.showcase', 'true'
        }
        server {
            server()
            gameDirectory = project.file('runs/server')
            programArgument '--nogui'
        }
        // Runs the mod's GameTests headlessly, then exits (non-zero on failure).
        gameTestServer {
            type = "gameTestServer"
            gameDirectory = project.file('runs/gametest')
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

jar {
    // the showcase harness is a development tool only
    exclude 'com/sugarplumstudios/plushies/dev/**'
    finalizedBy('reobfJar')
}

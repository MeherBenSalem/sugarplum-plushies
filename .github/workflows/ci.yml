# Temporary: runs the showcase client and commits its screenshots to this branch, so they can be
# fetched with git. This branch is deleted once the screenshots are copied into the marketing kit.
name: Showcase screenshots
on:
  push:
    branches: [scratch/showcase-screenshots]
permissions:
  contents: write
jobs:
  shots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - run: sudo apt-get update && sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0 mesa-utils
      - run: chmod +x gradlew
      - timeout-minutes: 20
        run: xvfb-run -a -s "-screen 0 1920x1080x24 +extension GLX +extension RENDER" ./gradlew runClient -Pshowcase
      - run: |
          mkdir -p shots && cp run/screenshots/plushies_*.png shots/
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add shots && git commit -m "Showcase screenshots" && git push

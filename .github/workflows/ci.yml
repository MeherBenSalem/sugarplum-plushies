# CI for Sugarplum Plushies (NightBeam convention; modelled on RE:Constructed Wands' ci.yml; it absorbs the old Forge-only ci.yml).
# Builds all 8 jars (1.20.1 Fabric + Forge; 1.21.1, 26.2, 26.3 Fabric + NeoForge) with ./gradlew buildAll, checks
# that every workspace has the same version= and that the metadata ranges stay inside their Minecraft line, runs the
# publisher script tests (the same-day guard and the jar-name detection the upload step uses), and checks that the
# mod runs:
#   - the 1.20.1 Forge jar: manifest, mods.toml, SRG names, no showcase harness (the old Forge-only CI checks);
#   - the mod's GameTests on 1.20.1 Forge (runGameTestServer);
#   - a real Forge 1.20.1 dedicated server booted with the built jar that places every block state;
#   - a dev server for every target that places every block state (scripts/server-smoke-test.sh);
#   - a 1.20.1 Forge client that builds the showcase world, screenshots it and quits (runClient -Pshowcase).
# It never publishes anything.

name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Check publisher syntax
        run: |
          for f in scripts/*.mjs .github/scripts/*.js; do node --check "$f"; done
      - name: Test publisher scripts (same-day guard)
        run: node --test scripts/*.test.mjs
      # Jar name -> loader + Minecraft version, as the upload step reads it (calendar versions such as 26.2 must
      # never fall back to 1.21.1).
      - name: Test jar metadata detection
        run: node .github/scripts/detect-jar-meta.test.js
      - name: Check the 8 targets, one version and metadata ranges
        run: python3 scripts/check_targets.py workspaces

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 21 stays JAVA_HOME (Gradle for 1.20.1/1.21.1); 17 is the 1.20.1 toolchain; the root build hands 26.x
      # JAVA_HOME_25_X64.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            17
            25
            21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build all 8 jars
        run: |
          chmod +x gradlew 1.20.1/gradlew 1.21.1/gradlew 26.2/gradlew 26.3/gradlew
          ./gradlew buildAll --no-daemon --continue
      - name: Check the 8 jars
        shell: bash
        run: |
          set -euo pipefail
          version="$(python3 scripts/check_targets.py version)"
          python3 scripts/check_targets.py jars --version "$version" --dir releases --list-file ci-jars.txt
          mkdir -p ci-jars
          xargs -a ci-jars.txt cp -f -t ci-jars/
          # The upload step must be able to read loader + Minecraft version from every built jar name.
          while IFS= read -r jar; do node .github/scripts/detect-jar-meta.js "$jar"; done < ci-jars.txt
      - name: Check the 1.20.1 Forge jar
        shell: bash
        run: |
          set -euo pipefail
          V="$(python3 scripts/check_targets.py version)"
          name="sugarplumplushies-forge-1.20.1-$V.jar"
          jar="ci-jars/$name"
          [ -f "$jar" ] || { echo "Missing $jar"; exit 1; }
          dir=$(mktemp -d); unzip -q "$jar" -d "$dir"
          grep -q "Implementation-Version: $V" "$dir/META-INF/MANIFEST.MF" || { echo "Manifest is not $V"; exit 1; }
          grep -q 'modId="sugarplumplushies"' "$dir/META-INF/mods.toml" || { echo "mods.toml has no sugarplumplushies"; exit 1; }
          grep -q "version=\"$V\"" "$dir/META-INF/mods.toml" || { echo "mods.toml version is not $V"; exit 1; }
          [ ! -d "$dir/com/sugarplumstudios/plushies/dev" ] || { echo "The showcase harness is in the jar"; exit 1; }
          [ -f "$dir/com/sugarplumstudios/plushies/SugarplumPlushies.class" ] || { echo "No SugarplumPlushies class"; exit 1; }
          find "$dir/com" -name '*.class' -exec strings {} + | grep -q -E '^(m|f)_[0-9]+_$' || { echo "The jar is not SRG-mapped"; exit 1; }
          echo "OK $name $(stat -c %s "$jar") bytes"
      - uses: actions/upload-artifact@v4
        with:
          name: sugarplumplushies-jars
          path: ci-jars/*.jar
          if-no-files-found: error

  gametests:
    name: GameTests (1.20.1 Forge)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            17
            21
      - uses: gradle/actions/setup-gradle@v4
      - name: Run the GameTests
        timeout-minutes: 25
        working-directory: 1.20.1
        run: |
          chmod +x gradlew
          ./gradlew :forge:runGameTestServer --stacktrace -Porg.gradle.java.installations.fromEnv=JAVA_HOME_17_X64,JAVA_HOME_21_X64

  server-boot:
    name: Server boot test with the built 1.20.1 Forge jar
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/download-artifact@v4
        with:
          name: sugarplumplushies-jars
          path: jars
      - run: chmod +x scripts/server-boot-test.sh
      - name: Boot a Forge server and place every block state
        timeout-minutes: 15
        run: scripts/server-boot-test.sh jars/sugarplumplushies-forge-1.20.1-*.jar
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: server-boot-test
          path: |
            build/boot-test-server/boot.log
            build/boot-test-server/logs/**
            build/boot-test-server/crash-reports/**
          if-no-files-found: ignore

  # Starts a real dev server for each target and places every block state (every plushie variant), so the registries, block entities and
  # loader glue of each line run (a compile alone can't prove that). 1.20.1 Fabric and 26.3 Fabric must pass.
  server-smoke:
    name: Server smoke test, ${{ matrix.loader }} ${{ matrix.minecraft }}
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.optional }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { minecraft: "1.20.1", loader: fabric, toolchain: "17", gradle_java: "21", optional: false }
          - { minecraft: "1.20.1", loader: forge, toolchain: "17", gradle_java: "21", optional: true }
          - { minecraft: "1.21.1", loader: fabric, toolchain: "17", gradle_java: "21", optional: true }
          - { minecraft: "1.21.1", loader: neoforge, toolchain: "17", gradle_java: "21", optional: true }
          - { minecraft: "26.2", loader: fabric, toolchain: "21", gradle_java: "25", optional: true }
          - { minecraft: "26.2", loader: neoforge, toolchain: "21", gradle_java: "25", optional: true }
          - { minecraft: "26.3", loader: fabric, toolchain: "21", gradle_java: "25", optional: false }
          - { minecraft: "26.3", loader: neoforge, toolchain: "21", gradle_java: "25", optional: true }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            ${{ matrix.toolchain }}
            ${{ matrix.gradle_java }}
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x ${{ matrix.minecraft }}/gradlew scripts/server-smoke-test.sh
      - name: Place every block state on a dev server
        timeout-minutes: 25
        run: scripts/server-smoke-test.sh ${{ matrix.minecraft }} ${{ matrix.loader }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: server-smoke-${{ matrix.minecraft }}-${{ matrix.loader }}
          path: |
            server-smoke-*.log
            ${{ matrix.minecraft }}/${{ matrix.loader }}/runs/server/crash-reports/**
          if-no-files-found: ignore

  client-showcase:
    name: Client showcase test (1.20.1 Forge)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            17
            21
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Xvfb and Mesa
        run: sudo apt-get update && sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0 mesa-utils
      - name: Launch the client, build the showcase world, screenshot it and quit
        timeout-minutes: 25
        working-directory: 1.20.1
        run: |
          chmod +x gradlew
          xvfb-run -a -s "-screen 0 1920x1080x24 +extension GLX +extension RENDER" sh -c 'glxinfo -B | head -20; ./gradlew :forge:runClient -Pshowcase --stacktrace -Porg.gradle.java.installations.fromEnv=JAVA_HOME_17_X64,JAVA_HOME_21_X64'
      - name: Check the screenshots and the log
        working-directory: 1.20.1/forge/runs/client
        run: |
          set -e
          ls -la screenshots || true
          n=$(ls screenshots/plushies_*.png 2>/dev/null | wc -l)
          echo "$n showcase screenshots"
          [ ! -d crash-reports ] || { head -150 crash-reports/*.txt; exit 1; }
          [ "$n" -ge 11 ] || { echo "Expected 11 showcase screenshots"; exit 1; }
          if grep -E "ERROR|Exception|Caused by" logs/latest.log | grep -E 'com.sugarplumstudios|sugarplumplushies([^-.a-z]|$)'; then echo "The log has errors naming Sugarplum Plushies"; exit 1; fi
      - name: Errors in the log
        if: always()
        run: grep -n -E "ERROR|Exception|Caused by|at com\.sugarplum" 1.20.1/forge/runs/client/logs/latest.log | head -200 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: client-showcase
          path: |
            1.20.1/forge/runs/client/screenshots/**
            1.20.1/forge/runs/client/logs/latest.log
            1.20.1/forge/runs/client/crash-reports/**
          if-no-files-found: ignore
